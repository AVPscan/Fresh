name: Linux musl static +(Cross-Platform)

# Внимание: Разрешение на запись необходимо для создания релиза и загрузки файлов
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.00)'
        required: true
        type: string

jobs:
  build-din:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      # 1. Собираем обычный (динамический) бинарник
    - name: Build Dynamic
      run: make c
    - name: Upload Dynamic Artifact
      uses: actions/upload-artifact@v4
      with:
         name: linux-dynamic
         path: fresh      
  # --- Сборка LINUX (без изменений) ---
  build-linux:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install build tools (GCC, make, and musl in Alpine)
        run: apk add --no-cache build-base make musl binutils
      # 2. Собираем статический (musl) бинарник
      - name: Build Static Musl
        run: make musl
      - name: Upload Static Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-static
          path: fresh

  # --- Сборка WINDOWS (без изменений) ---
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run make OS=Windows_NT
        shell: bash
        run: make OS=Windows_NT
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: fresh.exe

  # --- Сборка MACOS (без изменений) ---
  build-macos:
    runs-on: macos-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run make mac
        run: make mac
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-executable
          path: fresh

  # --- Создание релиза ---
  create-release:
    needs: [build-din,build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      # 1. Обязательный шаг для работы утилиты gh
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Определяем версию
      - name: Get the release version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi
      
      # 3. Скачиваем собранное
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artefacts

      # 4-5. Ультимативное создание релиза и загрузка
      - name: Create and Upload Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="v$VERSION"

          # 1. Пытаемся создать релиз. Игнорируем ошибку, если он уже есть.
          gh release create "$TAG" --title="Release $TAG" --generate-notes --latest || echo "Release already exists"

          # Чистим старое, если есть (твой проверенный метод)
          gh release delete-asset "$TAG" "Fresh-linux-dynamic-$TAG" -y || true
          gh release delete-asset "$TAG" "Fresh-linux-musl-$TAG" -y || true
          gh release delete-asset "$TAG" "Fresh-windows-$TAG.exe" -y || true
          gh release delete-asset "$TAG" "Fresh-macos-$TAG" -y || true

          # Переименовываем и заливаем
          cp ./artefacts/linux-dynamic/fresh ./Fresh-linux-dynamic-$TAG
          cp ./artefacts/linux-static/fresh ./Fresh-linux-musl-$TAG
          cp ./artefacts/windows-executable/fresh.exe ./Fresh-windows-$TAG.exe
          cp ./artefacts/macos-executable/fresh ./Fresh-macos-$TAG

          gh release upload "$TAG" ./Fresh-linux-dynamic-$TAG
          gh release upload "$TAG" ./Fresh-linux-musl-$TAG
          gh release upload "$TAG" ./Fresh-windows-$TAG.exe
          gh release upload "$TAG" ./Fresh-macos-$TAG
