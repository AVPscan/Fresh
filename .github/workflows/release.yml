name: Linux musl static +(Cross-Platform)

# Внимание: Разрешение на запись необходимо для создания релиза и загрузки файлов
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.00)'
        required: true
        type: string

jobs:
  # --- Сборка LINUX (без изменений) ---
  build-linux:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install build tools (GCC, make, and musl in Alpine)
        run: apk add --no-cache build-base make musl binutils
      - name: Run make musl
        run: make musl
      - name: Check binary status
        run: |
          file fresh
          ldd fresh || echo "✅ Статус: Statically linked"
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-executable
          path: fresh

  # --- Сборка WINDOWS (без изменений) ---
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run make OS=Windows_NT
        shell: bash
        run: make OS=Windows_NT
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: fresh.exe

  # --- Сборка MACOS (без изменений) ---
  build-macos:
    runs-on: macos-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run make mac
        run: make mac
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-executable
          path: fresh

  # --- Создание релиза (Исправлено для удаления предупреждений) ---
  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get the release version from tag or input
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Download Linux Executable
        uses: actions/download-artifact@v4
        with:
          name: linux-executable
          path: ./artefacts/linux

      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: ./artefacts/windows

      - name: Download MacOS Executable
        uses: actions/download-artifact@v4
        with:
          name: macos-executable
          path: ./artefacts/macos

      - name: Create and Upload Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG_NAME="v$VERSION"
          RELEASE_NAME="Release v$VERSION"
          
          # Создаем релиз и сразу загружаем файлы
          gh release create "$TAG_NAME" \
            "./artefacts/linux/fresh#Fresh-linux-musl-v$VERSION" \
            "./artefacts/windows/fresh.exe#Fresh-windows-v$VERSION.exe" \
            "./artefacts/macos/fresh#Fresh-macos-v$VERSION" \
            --repo="$GITHUB_REPOSITORY" \
            --title="$RELEASE_NAME" \
            --generate-notes \
            --latest
