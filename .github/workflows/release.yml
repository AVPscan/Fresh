name: Linux musl static +(Cross-Platform)

# Внимание: Разрешение на запись необходимо для создания релиза и загрузки файлов
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.00)'
        required: true
        type: string

jobs:
  # --- Сборка LINUX (без изменений) ---
  build-linux:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install build tools (GCC, make, and musl in Alpine)
        run: apk add --no-cache build-base make musl binutils
      - name: Run make musl
        run: make musl
      - name: Check binary status
        run: |
          file fresh
          ldd fresh || echo "✅ Статус: Statically linked"
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-executable
          path: fresh

  # --- Сборка WINDOWS (без изменений) ---
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run make OS=Windows_NT
        shell: bash
        run: make OS=Windows_NT
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: fresh.exe

  # --- Сборка MACOS (без изменений) ---
  build-macos:
    runs-on: macos-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run make mac
        run: make mac
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-executable
          path: fresh

  # --- Создание релиза ---
  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      # 1. Обязательный шаг для работы утилиты gh
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Определяем версию
      - name: Get the release version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi
      
      # 3. Скачиваем собранное
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artefacts

      # 4. Создаем релиз
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          gh release create "v$VERSION" \
            --repo="$GITHUB_REPOSITORY" \
            --title="Release v$VERSION" \
            --generate-notes \
            --latest

      # 5. Загружаем файлы (с переименованием)
      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="v$VERSION"
          gh release upload "$TAG" "./artefacts/linux-executable/fresh#Fresh-linux-musl-$TAG"
          gh release upload "$TAG" "./artefacts/windows-executable/fresh.exe#Fresh-windows-$TAG.exe"
          gh release upload "$TAG" "./artefacts/macos-executable/fresh#Fresh-macos-$TAG"
